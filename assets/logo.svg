<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Document Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Neural Glow Gradient -->
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Glow Filter for Neural Spark -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Icon Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Document / Resume Shape with Folded Top-Right Corner -->
  <g filter="url(#cardShadow)">
    <!-- Document Main Body -->
    <path d="M 120 100 
             L 300 100 
             L 380 180 
             L 380 412 
             A 20 20 0 0 1 360 432 
             L 140 432 
             A 20 20 0 0 1 120 412 
             Z" 
          fill="url(#docGrad)" />

    <!-- Folded Corner Flap -->
    <path d="M 300 100 
             L 300 164 
             A 16 16 0 0 0 316 180 
             L 380 180 
             Z" 
          fill="#CBD5E1" />
  </g>

  <!-- Resume Header: Avatar & Title lines -->
  <circle cx="172" cy="168" r="22" fill="#0284C7" />
  <path d="M 160 186 A 14 14 0 0 1 184 186 Z" fill="#E0F2FE" />
  <circle cx="172" cy="163" r="8" fill="#E0F2FE" />

  <rect x="210" y="152" width="70" height="12" rx="6" fill="#0F172A" />
  <rect x="210" y="172" width="45" height="8" rx="4" fill="#64748B" />

  <!-- Resume Content Text Lines -->
  <rect x="150" y="218" width="130" height="8" rx="4" fill="#94A3B8" />
  <rect x="150" y="238" width="105" height="8" rx="4" fill="#CBD5E1" />
  <rect x="150" y="258" width="120" height="8" rx="4" fill="#CBD5E1" />

  <rect x="150" y="292" width="90" height="8" rx="4" fill="#94A3B8" />
  <rect x="150" y="312" width="115" height="8" rx="4" fill="#CBD5E1" />
  <rect x="150" y="332" width="80" height="8" rx="4" fill="#CBD5E1" />

  <!-- Skills Pill Badges on Resume -->
  <rect x="150" y="365" width="44" height="18" rx="9" fill="#E0F2FE" />
  <rect x="202" y="365" width="48" height="18" rx="9" fill="#EEF2FF" />
  <rect x="258" y="365" width="40" height="18" rx="9" fill="#F0FDF4" />

  <!-- AI Neural Network & Lens Overlay (Screening Intelligence) -->
  <g filter="url(#glow)">
    <!-- Neural Synapse Connections -->
    <line x1="330" y1="240" x2="385" y2="295" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />
    <line x1="385" y1="295" x2="340" y2="365" stroke="#818CF8" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />
    <line x1="385" y1="295" x2="435" y2="345" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />
    <line x1="330" y1="240" x2="415" y2="230" stroke="#818CF8" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <line x1="415" y1="230" x2="385" y2="295" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <line x1="415" y1="230" x2="445" y2="270" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    <line x1="445" y1="270" x2="435" y2="345" stroke="#818CF8" stroke-width="4" stroke-linecap="round" opacity="0.8" />

    <!-- Pulse Rings around main central node -->
    <circle cx="385" cy="295" r="32" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.4" stroke-dasharray="4 4" />

    <!-- Neural Nodes -->
    <!-- Peripheral Nodes -->
    <circle cx="330" cy="240" r="10" fill="#0284C7" stroke="#BAE6FD" stroke-width="3" />
    <circle cx="415" cy="230" r="9" fill="#4F46E5" stroke="#C7D2FE" stroke-width="3" />
    <circle cx="445" cy="270" r="8" fill="#0284C7" stroke="#BAE6FD" stroke-width="2.5" />
    <circle cx="435" cy="345" r="11" fill="#4F46E5" stroke="#C7D2FE" stroke-width="3" />
    <circle cx="340" cy="365" r="10" fill="#0284C7" stroke="#BAE6FD" stroke-width="3" />

    <!-- Primary Central Screening AI Core Node -->
    <circle cx="385" cy="295" r="18" fill="url(#neuralGrad)" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="385" cy="295" r="7" fill="#FFFFFF" />

    <!-- Screening Sparkle / Star Indicator -->
    <path d="M 385 272 Q 385 282 395 282 Q 385 282 385 292 Q 385 282 375 282 Q 385 282 385 272 Z" fill="#F8FAFC" />
  </g>
</svg>
